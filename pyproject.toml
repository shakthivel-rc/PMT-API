# Test + coverage configuration for the Base Project API.
# NOTE: intentionally has NO [build-system] table — this file is config only, it does
# not turn this API into an installable package.

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure/unit tests that need no database",
    "integration: tests that require a database (SQLite locally, MySQL in CI)",
    "live: tests that talk over HTTP to a running stack; skipped unless LIVE_API_URL is set",
]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    "alembic/*",
    "seeders/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Ratchet floor. Raise this, never lower it.
#
# The threshold applies to *whatever ran*, which is the constraint that decides the number:
#
#   pytest --cov            (unit + integration)  → 59.1%
#   pytest -m unit --cov    (the no-database subset) → 41.2%
#
# 40 is set just under the lower of the two, because a floor above the subset would fail
# the very run the `unit` marker exists to make convenient — which is how a coverage gate
# teaches people to pass `--no-cov`.
#
# Reset from 65 on 2026-08-21 when the chat/RAG engine was removed. That 65 was calibrated
# against a suite whose largest single contributor was `rag/service.py` at 91% and whose
# unit subset measured 68%; with those tests gone the number described a suite that no
# longer exists.
#
# Raised 40 -> 48 on 2026-08-26 by the hardening pass. Re-measured, not guessed:
#
#   pytest --cov            (unit + integration)  → 72.9%
#   pytest -m unit --cov    (the no-database subset) → 49.3%
#
# Same rule as before — just under the LOWER of the two, so the `unit` marker stays the
# convenient thing it exists to be. The reason the number moved so far is not new tests
# alone; it is that 40 had drifted a long way below what the suite already reached, and a
# floor nothing can fail teaches people to ignore it. The pass added ~110 tests (route
# inventory, rate limiting, security headers, the secret canary, the event-loop check),
# which is worth perhaps two of those eight points.
#
# Raised 48 -> 53 on 2026-09-28, when the Jenkins domain was removed and this became the
# base project. Re-measured, not guessed:
#
#   pytest --cov            (unit + integration)  → 65.1%
#   pytest -m unit --cov    (the no-database subset) → 54.1%
#
# Both moved, in opposite directions, and neither because of a test change. The full run
# FELL from 72.9 because the domain code that left was better covered by the whole suite
# than what remains, which is weighted towards the identity controllers that only the
# integration tests reach. The unit run ROSE from 49.3 because the same code was covered
# worse by the no-database subset than the cross-cutting core it leaves behind. Same rule as
# before: just under the LOWER of the two, with the same one-point margin the last two
# resets used.
#
# The gap between the two runs is the integration-only surface. Closing it means covering
# the identity services with tests that need no database — unchanged advice, and still the
# highest-value place to spend the next hour.
#
# 2026-09-29, the project-management core (workspaces, issues, board, GitHub webhook, AI
# queue and worker) with its tests. Re-measured, not raised:
#
#   pytest --cov            (unit + integration)  → 78.9%
#   pytest -m unit --cov    (the no-database subset) → 54.9%
#
# The full run rose 14 points because the new domain is tested mostly through the HTTP
# API (tests/integration/test_workspaces_and_issues.py and friends). The unit run barely
# moved, and it is the lower of the two, so by the rule above the floor stays at 53 — the
# same margin the last reset left. The integration-only surface is now mostly the new
# controllers; their pure halves (utils/rank.py, utils/issue_keys.py, ai/prompts.py,
# integrations/github.py) are the ones already covered without a database.
fail_under = 53

# ---------------------------------------------------------------------------------------
# Lint. Added 2026-08-26 by the hardening pass, because the API had no lint gate at all
# while the SPA had eslint, tsc and three ratchets. The asymmetry was the wrong way round:
# the API is the half that holds the password hashes and signs the tokens.
#
# The configuration describes the code that exists rather than the code somebody would
# write from scratch: every number below was measured, and the backlog it leaves is
# recorded per file in `ruff-suppressions.json` — a ledger that may shrink and never grow.
# Nothing here reformats anything; `ruff format` is deliberately NOT wired in, because the
# comments in this repository are hand-wrapped prose and a formatter would shred them.
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "venv", "myenv", ".ruff_cache", ".pytest_cache", "htmlcov"]

[tool.ruff.lint]
# E,F,W  pycodestyle + pyflakes — the baseline.
# I      import order. Mechanical, and the one thing every reviewer otherwise argues about.
# B      bugbear: mutable defaults, loop-variable capture, the real bug classes.
# UP     pyupgrade — this targets 3.12 only, so `Optional[X]` and `datetime.utcnow()` are
#        legacy rather than compatibility.
# S      bandit. The reason this list is not shorter: this service stores password
#        hashes and session tokens and signs JWTs.
# ASYNC  every `async def` handler shares one event loop; one blocking call stalls them all.
# C4,SIM,RUF  comprehension, simplification and ruff-native correctness rules.
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# `assert` IS the test. S101 in a test suite is one finding per assertion, all saying "this
# is a test".
# S105-S107 likewise: the hardcoded passwords in the suite are fixtures, and a fixture
# password that is not hardcoded is a flaky test.
# S603/S607: the suite runs this repository's own scripts (bootstrap.sh, the secret
# scanner, docker compose) with argument lists it wrote itself. There is no untrusted
# input within reach, and the alternative — absolute paths to `docker` and `bash` — would
# make the tests machine-specific.
# S311 (added 2026-09-29): the board-ordering fuzz test (tests/unit/test_rank.py) uses a
# SEEDED `random.Random` on purpose — a failure has to reproduce. Nothing a test generates is
# a secret; the rule stays on everywhere else, where `secrets` is the answer (CLAUDE.md §7).
"tests/**" = ["S101", "S105", "S106", "S107", "S311", "S603", "S607"]
# The repository's own tooling shells out to `git` by name, on purpose: an absolute path
# would be wrong on every machine but the one it was written on, and the argument lists are
# literals in the same file. S603/S607 describe a risk that needs untrusted input to exist.
"scripts/**" = ["S603", "S607"]
# Alembic writes these files; their import block and line lengths are not ours to argue
# with. The migration BODY is still linted — that is where a real mistake would live.
"alembic/versions/**" = ["E501", "I001", "UP"]
# S310: Pure Python cloud storage MCP clients for AWS S3 and Azure Blob operate directly
# over standard-library HTTP/HTTPS requests to verified cloud object endpoints.
"integrations/mcp/*_client.py" = ["S310"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole dependency-injection design is a function call in a default argument.
# Without this, B008 reports one finding per dependency, all of them the framework working
# as intended.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = [
    "ai", "controllers", "core", "db", "dependencies", "integrations", "models", "routes",
    "schemas", "seeders", "services", "utils", "workers",
]

# ---------------------------------------------------------------------------------------
# Types. Scoped, deliberately, rather than repo-wide.
#
# Repo-wide strict on partly-untyped Python produces a number so large that the first
# person to see it turns the check off. These are the modules where a type error is a
# production incident and the surface is already annotated: the settings object every
# other module reads, the redactor every log line passes through, the token helpers, and
# the request/response schemas.
#
# The list is meant to grow. Adding a module is a one-line change plus whatever it takes
# to make it green, which is the right size for a piece of work someone can finish.
#
# `explicit_package_bases` + `mypy_path` are load-bearing: there is an `__init__.py` at the
# repo root, so without them mypy infers the package name from the directory and refuses
# with "pmt-api is not a valid Python package name".
[tool.mypy]
python_version = "3.12"
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
# The runtime dependencies ship no stubs worth installing for a scoped check.
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
files = [
    "core/config.py",
    "core/redact.py",
    "utils",
    "schemas",
    # Added 2026-09-29 with the project-management core. The pure halves of the AI and
    # GitHub paths: the prompt and its cache key, the one module that calls the model, the
    # webhook signature check, and the tenancy gate every workspace route declares — each
    # a place where a type error is a security or billing incident rather than a 500.
    "ai/prompts.py",
    "ai/client.py",
    "integrations/github.py",
    "dependencies/workspace.py",
]
